# no package runs code at install
allowBuilds:
  esbuild: false
# astro lists sharp as optional; its images come optimised from src/assets
ignoredOptionalDependencies:
  - sharp
minimumReleaseAge: 20160 # minutes (14 days)
blockExoticSubdeps: true
trustPolicy: no-downgrade
overrides:
  chokidar: 5.0.0
