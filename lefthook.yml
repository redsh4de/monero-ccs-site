# Use example from https://lefthook.dev/
pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{js,ts,jsx,tsx,astro,mjs}"
      run: npx eslint --fix {staged_files}
      stage_fixed: true
    lint-css:
      glob: "*.{css,astro}"
      run: npx stylelint {staged_files}
      stage_fixed: true
    format:
      glob: "*.{js,ts,jsx,tsx,astro,json,md,css}"
      run: npx prettier --write {staged_files}
      stage_fixed: true

pre-push:
  commands:
    render:
      # the example data has every state, so a template and the render can't drift apart
      run: pnpm build && pnpm render
