name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.8.1 # the Node that release.sh builds with
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: build and render the example data
        run: pnpm build && pnpm render
      - run: pnpm test
      - name: no inline styles, which the CSP blocks
        run: |
          if grep -rlE '<style|[[:space:]]style="' dist --include='*.html'; then
            exit 1
          fi

  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.8.1 # the Node that release.sh builds with
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:deploy
