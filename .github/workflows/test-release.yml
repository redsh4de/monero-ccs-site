name: test-release

# release.sh builds the site about eight times here, which takes too long for
# every pull request
on:
  schedule:
    - cron: "0 5 * * 1"
  pull_request:
    paths:
      - "deploy/*.sh"
      - "deploy/*.py"
      - deploy/site-hosts
      - "deploy/signer/**"
      - "deploy/guards/**"
      - deploy/render/safety.py
      - deploy/render/qr.py
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tests/deploy/test_release.py
      - tests/deploy/conftest.py
      - tests/deploy/pytest.ini
      - "tests/deploy/helpers/**"
      - tests/deploy/run.sh
      - tests/deploy/Containerfile
      - dev/Containerfile.render
      - .github/workflows/test-release.yml
      # the files the test's tags edit
      - astro.config.mjs
      - src/layouts/Layout.astro
      - src/styles/global.css
      - deploy/web/ccs-update.service
      - deploy/README.md

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sh tests/deploy/run.sh tests/deploy/test_release.py
