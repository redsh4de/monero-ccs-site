# The home and .ssh are root's, so ccs-fetch can't replace the authorized_keys
# that limits the push to in/values.
d /var/lib/ccs 0755 ccs-update ccs-update -
d /var/lib/ccs/in 0755 ccs-fetch ccs-fetch -
d /var/lib/ccs/fetch 0755 ccs-fetch ccs-fetch -
d /home/ccs-fetch 0755 root root -
d /home/ccs-fetch/.ssh 0755 root root -
# ccs-fetch's user manager stays up, so each push doesn't start and stop one,
# which logs about 50 lines a push
f /var/lib/systemd/linger/ccs-fetch 0644 root root -
# nginx's own /run, which nginx-sandbox.conf mounts; log rotation and
# nginx -t look for its pid file in the real one
d /run/nginx 0755 root root -
L+ /run/nginx.pid - - - - /run/nginx/nginx.pid
