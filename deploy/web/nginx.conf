# ccs.getmonero.org: serves the tree update.sh renders, with nothing dynamic.
# The certificate goes in /etc/ssl/ccs/: fullchain.pem and privkey.pem.

server {
    listen 80;
    listen [::]:80;
    server_name ccs.getmonero.org;
    # certificate renewals: an ACME client's webroot, and nothing else
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }
    location / {
        return 301 https://ccs.getmonero.org$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ccs.getmonero.org;

    ssl_certificate /etc/ssl/ccs/fullchain.pem;
    ssl_certificate_key /etc/ssl/ccs/privkey.pem;
    # Mozilla's intermediate configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:ccs:10m;
    ssl_session_tickets off;

    root /var/lib/ccs/current;
    disable_symlinks on from=$document_root;
    index index.html;
    autoindex off;
    ssi off;
    server_tokens off;

    charset utf-8;
    charset_types text/css application/json application/rss+xml;
    types {
        text/html html;
        text/css css;
        image/avif avif;
        image/webp webp;
        image/png png;
        font/woff2 woff2;
        application/json json;
        application/rss+xml xml;
    }
    default_type application/octet-stream;

    # Set once, here: a location with its own add_header would drop all of these.
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'self'; font-src 'self'; form-action 'none'; frame-ancestors 'none'; base-uri 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # ccs-back's JSON, at the address it always had
    location = /index.php/projects {
        default_type application/json;
    }

    # these file names carry their content's hash
    location /_astro/ {
        expires max;
    }
}
