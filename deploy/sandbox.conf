# The sandbox every ccs-*.service shares, on both machines. Each unit adds the
# socket families it needs (RestrictAddressFamilies=).
[Service]
EnvironmentFile=/etc/ccs/config
# no privileges: none to start with, none to gain
NoNewPrivileges=yes
CapabilityBoundingSet=
RestrictSUIDSGID=yes
# the system read-only, no home folders, a private /tmp, no devices
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectProc=invisible
ProcSubset=pid
RemoveIPC=yes
# the kernel, the clock and the host name out of reach
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
# only the system calls ordinary services make, on this machine's own ABI
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallFilter=~@privileged @resources
# no namespaces, no realtime, and no memory both writable and executable,
# which most exploits need
RestrictNamespaces=yes
RestrictRealtime=yes
MemoryDenyWriteExecute=yes
LockPersonality=yes
